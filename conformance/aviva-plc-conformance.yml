standards:
- id: rest
  conforms: true
  evidence: >-
    Portal developer guide states Aviva's APIs use Representational State Transfer
    (REST) architecture over HTTPS.
- id: oauth2
  conforms: true
  evidence: >-
    Portal developer guide documents OAuth 2.0 clients (Client_id / Client_secret)
    and a Bearer token in the Authorization header for consuming OAuth 2.0
    compliant Aviva APIs.
- id: oauth2-authorization-code
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server advertises grant_types_supported
    [authorization_code], response_types_supported [code] for the portal login.
- id: oauth2-pkce
  conforms: true
  evidence: code_challenge_methods_supported [S256] (RFC 7636) on the portal authorization server.
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server returns a valid RFC 8414 metadata
    document (HTTP 200) — for the portal login surface only.
- id: rfc9728-protected-resource-metadata
  conforms: false
  evidence: /.well-known/oauth-protected-resource returns the portal SPA shell, not metadata.
- id: openid-connect
  conforms: partial
