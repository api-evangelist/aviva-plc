compliance_program:
  published: false
  note: >-
    No public trust centre, certification page or SOC 2 / ISO 27001 attestation
    page was found on any Aviva domain (trust.aviva.com, security.aviva.com,
    /trust, /security, /compliance all miss). Aviva describes ISO 27001 and
