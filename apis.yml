apis:
- aid: aviva-plc:aviva-private-medical-insurance-consumer-pricing-api
  name: Aviva Private Medical Insurance Consumer Pricing API
  description: >-
    Listed in the Aviva API Developer Portal service catalogue as an API that
    calculates premiums for Aviva consumer Private Medical Insurance policies —
    the quote/rating verb of the Aviva Health API family. Access is
    partner-gated: the portal requires OIDC login, partners apply for sandbox
    access and then apply again to consume in production. The API detail page
    returns HTTP 403 to unauthenticated requests, and no OpenAPI, base URL or
    endpoint list is published outside the login wall.
  humanURL: https://developer.aviva.co.uk/api-details/details-pricing
  tags:
  - Health Insurance
  - Private Medical Insurance
  - Quotes
  - Rating
  - Partner Gated
  tags_raw:
  - Health Insurance
  - Private Medical Insurance
  - Quote
  - Rating
  - Partner Gated
  properties:
  - type: DeveloperPortal
    url: https://developer.aviva.co.uk/
  - type: Documentation
    url: https://developer.aviva.co.uk/documentation
- aid: aviva-plc:aviva-private-medical-insurance-consumer-purchase-api
  name: Aviva Private Medical Insurance Consumer Purchase API
  description: >-
    Listed in the Aviva API Developer Portal service catalogue as the purchase
    counterpart to the pricing API, enabling partners to submit applications for
    PMI policy enrolment into Aviva systems and automate the quote-to-buy
    journey — the bind/issue verbs of the Aviva Health API family. Access is
    partner-gated behind the portal's OIDC login and an approval workflow; the
    API detail page returns HTTP 403 to unauthenticated requests and no OpenAPI,
    base URL or endpoint list is published publicly.
  humanURL: https://developer.aviva.co.uk/api-details/details-purchase
  tags:
  - Health Insurance
  - Private Medical Insurance
  - Bind
  - Policy Issue
  - Partner Gated
  properties:
  - type: DeveloperPortal
    url: https://developer.aviva.co.uk/
  - type: Documentation
    url: https://developer.aviva.co.uk/documentation
