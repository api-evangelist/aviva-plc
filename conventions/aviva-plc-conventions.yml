generated: '2026-07-25'
method: searched
source: >-
  https://developer.aviva.co.uk/developer-guide and
  https://developer.aviva.co.uk/about (indexed copy; live pages return HTTP 403),
  plus live header probes of developer.aviva.co.uk and api.aviva.co.uk
note: >-
  Aviva publishes no OpenAPI, so nothing here is derived from a specification.
  Every entry is either quoted from the portal's own (search-indexed) developer
  guide or observed on a live response. Fields recorded as documented: false are
  honest absences — Aviva does not publish that convention outside the login wall;
  they are NOT assertions that the API lacks the behaviour.
architecture:
  style: REST
  transport: https
  formats: [application/json]
  evidence: >-
    "Aviva's Application Programming Interfaces use Representational State
    Transfer (REST) architecture." — Aviva API Developer Portal developer guide.
authentication:
  style: OAuth 2.0 bearer token
  header: Authorization
  format: Bearer <token>
  client_model: OAuth 2.0 client (Name, Client_id, Client_secret) created in the portal
  artifact: authentication/aviva-plc-authentication.yml
  documented: true
idempotency:
  documented: false
  header: null
  note: >-
    No idempotency key, retry-safety or duplicate-suppression contract is
    published on any Aviva surface. Not asserted either way for the gated APIs.
pagination:
  documented: false
  style: null
filtering_and_expansion:
  documented: false
metadata:
  documented: false
request_tracing:
  documented: false
  observed_headers:
