versioning:
  scheme: uri-path
  observed: >-
    The portal's own API is versioned in the path (/api/v2/portal). No versioning
    policy is published for the business APIs.
  documented: false
error_envelope:
  documented: false
  rfc9457: false
  note: >-
    No error reference, problem-type registry or error-envelope schema is
    published. Unauthenticated requests receive infrastructure errors only: a Nuxt
    "Forbidden" HTML page from the Kong portal and an Akamai "Access Denied" HTML
    page from api.aviva.co.uk — neither is an application error contract.
rate_limits:
  signalled: true
  artifact: rate-limits/aviva-plc-rate-limits.yml
  note: >-
    RateLimit-* and X-RateLimit-* headers are emitted by the developer portal API.
    No published quota for the business APIs.
security_transport:
  hsts: true
  tls: TLSv1.3
  artifact: security/aviva-plc-domain-security.yml
  note: >-
    developer.aviva.co.uk is served under an Extended Validation certificate issued
    to "Aviva PLC" (Sectigo Public Server Authentication CA EV R36) and sets
    Strict-Transport-Security max-age=31536000; includeSubDomains; preload, plus a
    full CSP, Permissions-Policy, X-Frame-Options SAMEORIGIN and
    Cross-Origin-Opener/Resource-Policy same-origin.
