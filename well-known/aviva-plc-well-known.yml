source: live probes of the Aviva developer portal and corporate hosts
note: >-
  Aviva's developer portal (Kong Konnect) answers several /.well-known/ paths with
  HTTP 200, but only /.well-known/oauth-authorization-server returns a real
  document. Every other path returns the portal's single-page-application HTML
  shell (identical 2,226-byte Nuxt document, <title>Developer Portal</title>) —
  a catch-all route, not a published discovery document. Those are recorded as
  status 200 with published: false so a later round does not mistake the shell
  for a real artifact.
