actions:
  openapiDirectoryCreated: false
  apisYmlCreated: true
  reason: |
    Recorded as an honest stub. Aviva plc operates a real Kong Konnect developer
    portal under its own EV certificate, but it is private by configuration
    (is_public false, RBAC enabled, OIDC required), returns 403 on every content
    path, and publishes empty public sitemaps. Zero machine-readable artifacts
    were retrievable, so no openapi/ directory was created. Two apis[] entries
    were recorded from the portal's own indexed catalogue page titles and
    flagged partner-gated; the SME pricing and enrolment APIs described in
    portal copy were omitted for lack of a confirmed URL. No ACORD reference
    exists anywhere on Aviva's surfaces — the UK carrier-to-broker seam is
    Polaris UK's imarket and PL EDI standards, plus the one-way Acturis claims
    API, neither of which is developer-addressable.
