aid: aviva-plc
name: Aviva plc
review:
  question: Does Aviva plc expose a real, self-serve public API surface, and what is its
    insurance data-standards posture?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: carrier-pc
  gated: true
  status: built-stub
findings:
  summary: |
    Aviva plc runs a genuine, modern API programme — and none of it is publicly
    consumable. A first-party developer portal exists at
    https://developer.aviva.co.uk, served under an Extended Validation
    certificate issued to "Aviva PLC" (Sectigo EV R36) and built on Kong
    Konnect (canonical domain bbb87a0dba4d.edge.eu.portal.konghq.com). The
    portal's own unauthenticated metadata endpoint, GET /api/v2/portal, returns
    HTTP 200 and reports "is_public": false, "rbac_enabled": true,
    "oidc_auth_enabled": true, "basic_auth_enabled": false,
    "saml_auth_enabled": false, "dcr_provider_ids": []. Every human content
    path — /, /documentation, /developer-guide, /about, /health, /get-started,
    /guides, /api-details/*, /login, /register — returns HTTP 403. The 403 is
    blanket (a deliberately bogus path such as /this-does-not-exist-xyz123 also
    returns 403), so no path-existence inference can be drawn from it. The
    portal's sitemap index resolves (/sitemap_index.xml -> /__sitemap__/pages.xml
    and /__sitemap__/apis.xml, both HTTP 200) but BOTH sitemaps are EMPTY
    urlsets — Aviva publishes zero pages and zero APIs to public indexing.
    Verdict: this is a partner/agent login wall, not a self-serve developer
    portal. No specification of any kind could be harvested.

    The API family behind the wall is Aviva's Health business. Search-engine
    indexed page titles from the portal's own service catalogue name
    "Private Medical Insurance Consumer Pricing" (/api-details/details-pricing)
    and "Private Medical Insurance Consumer Purchase" (/api-details/details-purchase),
    with portal copy describing premium calculation for consumer and SME PMI and
    an enrolment API that lets partners submit PMI applications into Aviva
    systems to "automate the complete journey from quote to buy". Those two
    entries are recorded in apis.yml on indexed-title provenance only; they were
    NOT retrieved (403). The SME pricing and enrolment APIs are described in
    portal copy but no stable URL was confirmed for them, so they are not
    listed as apis[] entries.

    The larger and more consequential integration channel is not the portal.
    In the UK, Aviva trades with brokers through Polaris UK Ltd's imarket
    commercial-lines platform — Aviva is named among the participating insurers
    alongside Allianz, Arch, AXA, Intact, QBE and Zurich — reaching broker
    management systems Acturis, Applied Systems, Bravo Digital Trader, Open GI
    and SSP, over Polaris's own code lists and PL EDI message standards. In
    December 2024 Aviva and Acturis launched what both parties describe as the
    first claims API from any insurer integrated with Acturis: a one-way
    transfer of new and updated personal and commercial motor, property and
    liability claim records from Aviva's claims system into a broker's Acturis
    system, with broker rollout from Q1 2025. That surface is delivered through
    the software house, not to developers.
