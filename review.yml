  acordPosture:
    phrase: no ACORD reference found; UK broker seam is Polaris UK (imarket, PL EDI messages
      and code lists) plus a one-way Acturis claims API
    acordReferenceFound: false
    searchedFor:
    - ACORD
    - AL3
    - ACORD XML
    - ACORD certified
    - NGDS
    note: >-
      No ACORD, AL3, ACORD XML, ACORD-certified or NGDS reference was found on
      aviva.com, aviva.co.uk, connect.avivab2b.co.uk or the gated developer
      portal's indexed surface. This is the expected UK pattern: the UK's
      carrier-to-broker data standard is Polaris UK's, not ACORD's. Aviva is a
      named participating insurer on Polaris imarket, which reaches Acturis,
      Applied Systems, Bravo Digital Trader, Open GI and SSP and publishes
      industry code lists and PL EDI messages through the Polaris Online
      Database. ACORD is relevant to the UK only via the London Market / Lloyd's
      Blueprint Two programme (EBOT/ECOT on ACORD 2016-10), which is a
      syndicate-and-broker programme Aviva's retail and commercial UK business
      does not trade through.
  insuranceVerbs:
    quote:
      exposed: true
      audience: partner-only
      note: PMI Consumer Pricing and PMI SME Pricing APIs named in the gated portal catalogue.
    bind:
      exposed: true
      audience: partner-only
      note: PMI Consumer Purchase / PMI enrolment API described as automating quote-to-buy
        into Aviva systems.
    issue:
      exposed: true
      audience: partner-only
      note: Same enrolment API — PMI policy enrolment into Aviva systems, 24/7.
    fnol:
      exposed: false
      audience: partner-only
      note: >-
        No first notification of loss API is exposed. The Aviva/Acturis claims
        API launched December 2024 is explicitly ONE-WAY — it pushes new and
        updated claim records out of Aviva into the broker's Acturis system. It
        does not accept a loss notification in, and it is delivered through the
        software house rather than through the developer portal.
  authModel:
    portalLogin: OAuth 2.0 authorization_code with PKCE (S256), OIDC-backed, RBAC-enforced
    apiConsumption: not publicly documented — access and production consumption granted
      by Aviva on partner application
    apiKeyDocumented: false
    mtlsDocumented: false
    samlToPortal: false
  specifications:
    openapiHarvested: false
    specsCount: 0
    note: No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto artifact is retrievable.
      /openapi.json and /swagger.json return 403; the Kong portal product endpoints
      return 404 unauthenticated; both public sitemaps are empty.
  webhooks:
    documented: false
    asyncapi: false
    note: No event catalogue, webhook reference or AsyncAPI document is published. The
      only event-shaped flow found is the one-way Acturis claims push, which is a
      software-house integration and is not documented publicly.
  postman:
    officialWorkspace: false
    note: Postman public search returns only unrelated third-party personal collections
      named "Aviva" in unverified "My Workspace" workspaces. No verified Aviva-published
      workspace or collection exists.
  graphql:
    documented: false
    note: developer.aviva.co.uk/graphql and api.aviva.co.uk/graphql both return 403 with
      no documentation; www.aviva.co.uk/graphql 301-redirects. Nothing introspectable
      or documented.
  transports:
